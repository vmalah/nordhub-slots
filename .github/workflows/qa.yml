name: QA · автотесты

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Какие тесты запускать (тег, например @schedule|@booking). Пусто — все.'
        required: false
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm install

      - name: Установить браузер
        run: npx playwright install --with-deps chromium

      - name: Запустить тесты
        run: npx playwright test ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}

      - name: Сводка в отчёт запуска
        if: always()
        run: node scripts/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить HTML-отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
